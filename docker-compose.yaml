name: tacto

services:
  postgres:
    image: postgres:16-alpine
    container_name: tacto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tacto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tacto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: tacto-api
    container_name: tacto-api
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      API_PORT: "8000"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:8000}"
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-http://localhost:3000}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tacto}"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: sh -c "pnpm db:deploy && pnpm --filter @repo/api start"

volumes:
  postgres_data:
