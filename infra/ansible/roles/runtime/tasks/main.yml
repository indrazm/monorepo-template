- name: Add the NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    enabled: true
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Bun for the application user
  ansible.builtin.shell:
    cmd: curl -fsSL https://bun.sh/install | bash -s "bun-v{{ bun_version }}"
    creates: "{{ bun_bin }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    HOME: "/home/{{ app_user }}"
