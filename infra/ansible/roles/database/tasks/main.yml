- name: Install PostgreSQL and Redis
  ansible.builtin.apt:
    name:
      - postgresql
      - redis-server
    state: present

- name: Enable PostgreSQL and Redis
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - postgresql
    - redis-server

- name: Keep Redis on the loopback interface
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^bind "
    line: "bind 127.0.0.1 -::1"
  notify: Restart Redis

- name: Ensure the database role exists
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    login_unix_socket: /var/run/postgresql
    state: present
  become: true
  become_user: postgres

- name: Ensure the database exists
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    login_unix_socket: /var/run/postgresql
    state: present
  become: true
  become_user: postgres
