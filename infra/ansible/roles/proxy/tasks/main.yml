- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Configure the reverse proxy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: Restart Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
